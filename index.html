
<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ginga Dance App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              'logo': ['"Titan One"', 'cursive'],
            },
            colors: {
              green: {
                50: '#f0fdf4',
                100: '#dcfce7',
                200: '#bbf7d0',
                300: '#86efac',
                400: '#4ade80',
                500: 'rgb(22 163 74)', // The requested green
                600: '#16a34a',
                700: '#15803d',
                800: '#166534',
                900: '#14532d',
                950: '#052e16',
              },
              ginga: {
                50: '#fff1f2',
                100: '#ffe4e6',
                500: '#f43f5e',
                600: '#e11d48', // Primary Brand Red
                900: '#881337',
              },
              'brand-yellow': '#facc15',
              'brand-green': 'rgb(22 163 74)',
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
            },
            boxShadow: {
              'glossy': 'inset 0 1px 1px rgba(255,255,255,0.5), 0 4px 6px rgba(0,0,0,0.05)',
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      /* Logo Stroke Utilities */
      .text-stroke-2 {
        -webkit-text-stroke: 2px black;
      }
      .text-stroke-1 {
        -webkit-text-stroke: 1px black;
      }
      .text-stroke-sm {
        -webkit-text-stroke: 0.5px black;
      }
      .paint-order-stroke {
        paint-order: stroke fill;
      }
    </style>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
